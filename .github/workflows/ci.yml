name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aiflow_m0_test
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, redis
      - name: Validate composer.json
        run: composer validate
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run smoke example
        run: php examples/boot.php
      - name: Run tests
        run: composer test
        env:
          AIFLOW_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=aiflow_m0_test;charset=utf8mb4
          AIFLOW_TEST_MYSQL_USER: root
          AIFLOW_TEST_MYSQL_PASS: root
